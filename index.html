<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>منصة البناء</title>
<style>

body{
margin:0;
font-family:Arial;
background:#f5f5f5;
}

.navbar{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 30px;
background:#0d2b45;
color:white;
}

.login-btn{
background:#ff6b2d;
border:none;
padding:10px 18px;
color:white;
border-radius:6px;
cursor:pointer;
}

.hero{
background:url("https://images.unsplash.com/photo-1503387762-592deb58ef4e") center/cover;
height:400px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center;
color:white;
position:relative;
}

.hero::before{
content:"";
position:absolute;
top:0;
left:0;
right:0;
bottom:0;
background:rgba(0,0,0,0.5);
}

.hero-content{
position:relative;
z-index:2;
}

.search-box{
margin-top:20px;
display:flex;
}

.search-box input{
padding:10px;
width:250px;
border:none;
border-radius:5px 0 0 5px;
}

.search-box button{
background:#ff6b2d;
border:none;
color:white;
padding:10px 20px;
border-radius:0 5px 5px 0;
}

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
text-align:center;
padding:40px;
background:white;
}

.stat h2{
color:#0d2b45;
}

</style>
</head>

<body>

<div class="navbar">
<h3>منصة البناء</h3>
<button class="login-btn">تسجيل الدخول</button>
</div>

<div class="hero">
<div class="hero-content">

<h1>منصة البناء المتكاملة</h1>
<p>ابحث عن أفضل المقاولين والمهندسين في المملكة العربية السعودية</p>

<div class="search-box">
<input type="text" placeholder="ابحث عن مهندس أو مقاول">
<button>بحث</button>
</div>

</div>
</div>

<div class="stats">

<div class="stat">
<h2>+200</h2>
<p>مقاول مسجل</p>
</div>

<div class="stat">
<h2>+500</h2>
<p>مهندس مسجل</p>
</div>

<div class="stat">
<h2>+3000</h2>
<p>طلب</p>
</div>

<div class="stat">
<h2>+1500</h2>
<p>مشروع</p>
</div>

</div>

</body>
</html>
